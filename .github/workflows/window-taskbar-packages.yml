name: Verify local Windowing and Taskbar packages

on:
  push:
    branches: [ "main", "*/base" ]
    paths:
      - ".github/workflows/window-taskbar-packages.yml"
      - "wasm2/KazoOs/Directory.Build.props"
      - "wasm2/KazoOs/Directory.Build.targets"
      - "wasm2/KazoOs/Platform/Packaging.props"
      - "wasm2/KazoOs/Shared/Kazo.Os.Theming.Abstractions/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Theming.Blazor/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Windowing.Abstractions/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Windowing.Core/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Windowing.Blazor/**"
      - "wasm2/KazoOs/Shared/Kazo.Os.AppSdk.Icons/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Taskbar.Blazor/**"
      - "wasm2/KazoOs/Samples/Kazo.Os.Windowing.SampleHost/**"
  pull_request:
    paths:
      - ".github/workflows/window-taskbar-packages.yml"
      - "wasm2/KazoOs/Directory.Build.props"
      - "wasm2/KazoOs/Directory.Build.targets"
      - "wasm2/KazoOs/Platform/Packaging.props"
      - "wasm2/KazoOs/Shared/Kazo.Os.Theming.Abstractions/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Theming.Blazor/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Windowing.Abstractions/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Windowing.Core/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Windowing.Blazor/**"
      - "wasm2/KazoOs/Shared/Kazo.Os.AppSdk.Icons/**"
      - "wasm2/KazoOs/Platform/Kazo.Os.Taskbar.Blazor/**"
      - "wasm2/KazoOs/Samples/Kazo.Os.Windowing.SampleHost/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  LOCAL_PACKAGE_OUTPUT: artifacts/local-nupkg
  NUGET_PACKAGES: ${{ github.workspace }}/wasm2/KazoOs/artifacts/windowing-sample-package-cache
  SAMPLE_PROJECT: Samples/Kazo.Os.Windowing.SampleHost/Kazo.Os.Windowing.SampleHost.csproj
  SAMPLE_PUBLISH_OUTPUT: artifacts/windowing-sample-package-publish

jobs:
  verify-package-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: wasm2/KazoOs

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet-sdk

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      # Project references become NuGet dependencies; dotnet pack does not automatically emit
      # those dependency packages. Keep this sequence in dependency-topological order.
      - name: Read the Kazo OS version
        shell: bash
        run: >-
          echo "KAZOOS_VERSION=$(sed -n 's:.*<KazoOsVersion>\(.*\)</KazoOsVersion>.*:\1:p' build/Versions.props)" >> "$GITHUB_ENV"

      - name: Pack theme contracts
        run: >-
          dotnet pack Shared/Kazo.Os.Theming.Abstractions/Kazo.Os.Theming.Abstractions.csproj
          --configuration Release --output "$LOCAL_PACKAGE_OUTPUT"

      - name: Pack Blazor theming
        run: >-
          dotnet pack Platform/Kazo.Os.Theming.Blazor/Kazo.Os.Theming.Blazor.csproj
          --configuration Release --output "$LOCAL_PACKAGE_OUTPUT"

      - name: Pack window contracts
        run: >-
          dotnet pack Platform/Kazo.Os.Windowing.Abstractions/Kazo.Os.Windowing.Abstractions.csproj
          --configuration Release --output "$LOCAL_PACKAGE_OUTPUT"

      - name: Pack window runtime
        run: >-
          dotnet pack Platform/Kazo.Os.Windowing.Core/Kazo.Os.Windowing.Core.csproj
          --configuration Release --output "$LOCAL_PACKAGE_OUTPUT"

      - name: Pack Blazor window chrome
        run: >-
          dotnet pack Platform/Kazo.Os.Windowing.Blazor/Kazo.Os.Windowing.Blazor.csproj
          --configuration Release --output "$LOCAL_PACKAGE_OUTPUT"

      - name: Pack icon SDK
        run: >-
          dotnet pack Shared/Kazo.Os.AppSdk.Icons/Kazo.Os.AppSdk.Icons.csproj
          --configuration Release --output "$LOCAL_PACKAGE_OUTPUT"

      - name: Pack taskbar
        run: >-
          dotnet pack Platform/Kazo.Os.Taskbar.Blazor/Kazo.Os.Taskbar.Blazor.csproj
          --configuration Release --output "$LOCAL_PACKAGE_OUTPUT"

      - name: Verify package and symbol closure
        shell: bash
        run: |
          package_ids=(
            Kazo.Os.Theming.Abstractions
            Kazo.Os.Theming.Blazor
            Kazo.Os.Windowing.Abstractions
            Kazo.Os.Windowing.Core
            Kazo.Os.Windowing.Blazor
            Kazo.Os.AppSdk.Icons
            Kazo.Os.Taskbar.Blazor
          )
          for package_id in "${package_ids[@]}"; do
            test -s "$LOCAL_PACKAGE_OUTPUT/$package_id.$KAZOOS_VERSION.nupkg"
            test -s "$LOCAL_PACKAGE_OUTPUT/$package_id.$KAZOOS_VERSION.snupkg"
          done

      - name: Restore sample from local packages only
        run: >-
          dotnet restore "$SAMPLE_PROJECT"
          --configfile Samples/Kazo.Os.Windowing.SampleHost/nuget.config
          --force-evaluate --no-cache
          -p:UseLocalKazoOsPackages=true

      - name: Verify restored dependency kinds and versions
        shell: bash
        run: |
          assets_file="Samples/Kazo.Os.Windowing.SampleHost/obj/project.assets.json"
          if grep -q '"type": "project"' "$assets_file"; then
            echo "Package-only restore unexpectedly retained a project dependency."
            exit 1
          fi
          package_ids=(
            Kazo.Os.Theming.Abstractions
            Kazo.Os.Theming.Blazor
            Kazo.Os.Windowing.Abstractions
            Kazo.Os.Windowing.Core
            Kazo.Os.Windowing.Blazor
            Kazo.Os.AppSdk.Icons
            Kazo.Os.Taskbar.Blazor
          )
          for package_id in "${package_ids[@]}"; do
            grep -q "\"$package_id/$KAZOOS_VERSION\"" "$assets_file"
          done

      - name: Build package-only sample
        run: >-
          dotnet build "$SAMPLE_PROJECT"
          --configuration Release --no-restore
          -p:UseLocalKazoOsPackages=true

      - name: Publish package-only sample
        run: >-
          dotnet publish "$SAMPLE_PROJECT"
          --configuration Release --no-restore
          --output "$SAMPLE_PUBLISH_OUTPUT"
          -p:UseLocalKazoOsPackages=true

      - name: Verify packaged theme static asset
        shell: bash
        run: >-
          test -s
          "$SAMPLE_PUBLISH_OUTPUT/wwwroot/_content/Kazo.Os.Theming.Blazor/themes.css"

      - name: Upload verified packages and sample
        uses: actions/upload-artifact@v6
        with:
          name: kazoos-windowing-packages-${{ github.run_attempt }}
          path: |
            wasm2/KazoOs/artifacts/local-nupkg
            wasm2/KazoOs/artifacts/windowing-sample-package-publish
          if-no-files-found: error
          retention-days: 7
