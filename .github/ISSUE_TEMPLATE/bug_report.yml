name: "Rapport de bogue / Bug report"
description: "Signaler un problème dans Kazo OS. / Report a problem in Kazo OS."
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Vérifiez d'abord les [issues ouvertes](https://github.com/Kazo-ca/HackerOs/issues). Vous pouvez écrire en français ou en anglais.

        Thank you! Check the [open issues](https://github.com/Kazo-ca/HackerOs/issues) first. You may write in French or in English.
  - type: textarea
    id: steps
    attributes:
      label: "Étapes pour reproduire / Steps to reproduce"
      placeholder: |
        1. Ouvrir… / Open…
        2. Cliquer sur… / Click…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Résultat attendu / Expected result"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Résultat obtenu / Actual result"
      description: "Captures d'écran et sortie de la console du navigateur bienvenues. / Screenshots and browser console output welcome."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Version de Kazo OS / Kazo OS version"
      description: "Paramètres ▸ À propos. / Settings ▸ About."
      placeholder: "2.2.2"
  - type: input
    id: environment
    attributes:
      label: "Navigateur et appareil / Browser and device"
      placeholder: "Chrome 141, Windows 11 / Safari, iPhone"
    validations:
      required: true
