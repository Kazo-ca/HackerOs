name: Release HackerOS

# ADR 0173: wasm2/HackerOs/build/Versions.props is the only version of HackerOS. When a
# commit of main carries a version that has no v<version> tag yet, and "Verify HackerOS
# WASM" passed on that commit, this workflow packs every published library, pushes the
# packages to nuget.org (when publishing is configured), then tags the commit and creates
# the GitHub Release with the packages and the WASM site attached.
#
# The tag is the "already released" marker: a commit of main whose version is already
# tagged releases nothing, so only a change of the version publishes.
#
# Manual run (workflow_dispatch, on main): releases the version of main if it is not tagged
# yet; with "republish" checked, packs the tagged version again and pushes it to nuget.org
# (packages already there are skipped), for a release made before NuGet was configured.
#
# ADR 0191 §5: once the release exists, the "server" jobs attach the installable HackerOS server
# (hackeros-server-<version>-<rid>.zip|tar.gz, build/publish-server.sh) to the same release and
# push its image ghcr.io/kazo-ca/hackeros-server (:<version> and, for a stable version, :latest).
on:
  workflow_run:
    workflows: [ "Verify HackerOS WASM" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      republish:
        description: Push the packages of the already released version to nuget.org again
        type: boolean
        default: false

permissions:
  contents: write  # tag and GitHub Release
  id-token: write  # nuget.org Trusted Publishing (NuGet/login)
  packages: write  # ghcr.io/kazo-ca/hackeros-server (ADR 0191)

# Never two releases at once, and never cancel one halfway through a push.
concurrency:
  group: release-hackeros
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  HACKEROS_SOLUTION_DIR: wasm2/HackerOs
  RELEASE_DIR: wasm2/HackerOs/artifacts/release
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Checkout the verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Decide what to release
        id: plan
        shell: bash
        env:
          REPUBLISH: ${{ github.event.inputs.republish || 'false' }}
        run: |
          version="$(sed -n 's:.*<HackerOsVersion>\(.*\)</HackerOsVersion>.*:\1:p' "$HACKEROS_SOLUTION_DIR/build/Versions.props")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Version::build/Versions.props has no valid HackerOsVersion ('$version')."
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            if [[ "$REPUBLISH" == "true" ]]; then
              mode="republish"
              git checkout --quiet "$tag"
            else
              mode="none"
            fi
          else
            mode="release"
          fi
          prerelease="false"
          [[ "$version" == *-* ]] && prerelease="true"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "mode=$mode"
            echo "prerelease=$prerelease"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          case "$mode" in
            none) echo "### HackerOS $version is already released ($tag): nothing to do." >> "$GITHUB_STEP_SUMMARY" ;;
            release) echo "### Releasing HackerOS $version ($tag)" >> "$GITHUB_STEP_SUMMARY" ;;
            republish) echo "### Pushing the packages of HackerOS $version ($tag) to nuget.org again" >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Setup .NET 10
        if: steps.plan.outputs.mode != 'none'
        uses: ./.github/actions/setup-dotnet-sdk

      - name: Install WASM workload
        if: steps.plan.outputs.mode != 'none'
        run: dotnet workload install wasm-tools

      - name: Pack the published libraries
        if: steps.plan.outputs.mode != 'none'
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        run: build/pack-local.sh --configuration Release --output artifacts/release/nupkg --ci

      # Only HackerOs.* packages of this version leave the runner (never a test fixture).
      - name: Check the packages
        if: steps.plan.outputs.mode != 'none'
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          shopt -s nullglob
          packages=("$RELEASE_DIR"/nupkg/HackerOs.*."$VERSION".nupkg)
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error title=Packages::No HackerOs.*.$VERSION.nupkg was produced."
            exit 1
          fi
          mkdir -p "$RELEASE_DIR/assets"
          cp "$RELEASE_DIR"/nupkg/HackerOs.*."$VERSION".nupkg "$RELEASE_DIR"/nupkg/HackerOs.*."$VERSION".snupkg "$RELEASE_DIR/assets/"
          {
            echo "${#packages[@]} packages:"
            for package in "${packages[@]}"; do echo "- $(basename "$package")"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the WASM site
        if: steps.plan.outputs.mode == 'release'
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        run: >-
          dotnet publish OS/HackerOs.Ecosystem/HackerOs.Ecosystem.csproj
          --configuration Release
          --output artifacts/release/publish

      - name: Zip the WASM site
        if: steps.plan.outputs.mode == 'release'
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          archive="$PWD/$RELEASE_DIR/assets/hackeros-wasm-$VERSION.zip"
          (cd "$RELEASE_DIR/publish/wwwroot" && zip -q -r "$archive" .)

      # Trusted Publishing when the NUGET_USER variable is set (short-lived key, no secret
      # stored); otherwise the NUGET_API_KEY secret; otherwise no push, with a warning.
      - name: Get a nuget.org key (Trusted Publishing)
        id: nuget-login
        if: steps.plan.outputs.mode != 'none' && vars.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the packages to nuget.org
        if: steps.plan.outputs.mode != 'none'
        shell: bash
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          TRUSTED_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          SECRET_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          key="${TRUSTED_KEY:-$SECRET_KEY}"
          if [[ -z "$key" ]]; then
            echo "::warning title=NuGet::nuget.org publishing is not configured (NUGET_USER variable or NUGET_API_KEY secret): packages are only attached to the GitHub Release."
            echo "NuGet: not configured, nothing pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # dotnet nuget push also pushes the .snupkg next to each .nupkg.
          for package in "$RELEASE_DIR"/nupkg/HackerOs.*."$VERSION".nupkg; do
            dotnet nuget push "$package" --api-key "$key" --source "$NUGET_SOURCE" --skip-duplicate
          done
          echo "NuGet: packages pushed to nuget.org." >> "$GITHUB_STEP_SUMMARY"

      # Last: the tag marks the version as released, so a failure above is retried by
      # rerunning the workflow (the push skips packages already on nuget.org).
      - name: Create the tag and the GitHub Release
        if: steps.plan.outputs.mode == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ steps.plan.outputs.sha }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          # ADR 0186 §7: the text comes from changes/<version>.json (every entry, in English);
          # GitHub's generated notes only for a version released before the change list existed.
          notes="$RELEASE_DIR/release-notes.md"
          if [[ -f "$HACKEROS_SOLUTION_DIR/changes/$VERSION.json" ]]; then
            dotnet run --project "$HACKEROS_SOLUTION_DIR/Tools/HackerOs.Tools.ChangeList/HackerOs.Tools.ChangeList.csproj" -c Release -- \
              notes --changes "$HACKEROS_SOLUTION_DIR/changes" --version "$VERSION" --kind release \
              --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --output "$notes"
            flags=(--title "HackerOS $VERSION" --target "$SHA" --notes-file "$notes")
          else
            echo "::warning title=Release notes::changes/$VERSION.json is missing (build/tools/collect-changes.sh): GitHub generates the notes."
            flags=(--title "HackerOS $VERSION" --target "$SHA" --generate-notes)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" "$RELEASE_DIR"/assets/*
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  # ADR 0191 §4-5: the installable server, self-contained in one file, for each system.
  server:
    needs: release
    if: needs.release.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64 ]
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Setup .NET 10
        uses: ./.github/actions/setup-dotnet-sdk

      - name: Install WASM workload
        run: dotnet workload install wasm-tools

      - name: Publish and pack the server
        id: pack
        working-directory: ${{ env.HACKEROS_SOLUTION_DIR }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          archive="$(build/publish-server.sh --rid "${{ matrix.rid }}" --version "$VERSION" --output artifacts/server | tail -n 1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          ARCHIVE: ${{ steps.pack.outputs.archive }}
        run: |
          gh release upload "$TAG" "$ARCHIVE" --clobber
          echo "Server: $(basename "$ARCHIVE")" >> "$GITHUB_STEP_SUMMARY"

      # The Linux publications are also the content of the Docker image (job "server-image").
      - name: Keep the Linux publication for the image
        if: startsWith(matrix.rid, 'linux-')
        uses: actions/upload-artifact@v6
        with:
          name: server-${{ matrix.rid }}
          path: ${{ env.HACKEROS_SOLUTION_DIR }}/artifacts/server/staging/
          retention-days: 1

  server-image:
    needs: [ release, server ]
    if: needs.release.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.sha }}

      - name: Get the Linux publications
        uses: actions/download-artifact@v7
        with:
          pattern: server-linux-*
          path: image-staging

      - name: Arrange them by Docker architecture
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p image/amd64 image/arm64
          cp -a "image-staging/server-linux-x64/hackeros-server-$VERSION-linux-x64/." image/amd64/
          cp -a "image-staging/server-linux-arm64/hackeros-server-$VERSION-linux-arm64/." image/arm64/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push ghcr.io/kazo-ca/hackeros-server
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          image="ghcr.io/kazo-ca/hackeros-server"
          tags=(--tag "$image:$VERSION")
          [[ "$PRERELEASE" == "true" ]] || tags+=(--tag "$image:latest")
          docker buildx build --platform linux/amd64,linux/arm64 \
            --file "$HACKEROS_SOLUTION_DIR/Server/HackerOs.Server/packaging/Dockerfile" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            "${tags[@]}" --push image
          echo "Image: $image:$VERSION" >> "$GITHUB_STEP_SUMMARY"
