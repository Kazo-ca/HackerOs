<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="60%">
      <stop offset="0" stop-color="#42d392" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#42d392" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#30363d"/>
    </pattern>
    <clipPath id="xclip"><rect x="128" y="185" width="104" height="143"/></clipPath>
    <symbol id="logo" viewBox="0 0 512 512">
      <circle cx="256" cy="256" r="223" fill="#161c22" stroke="#42d392" stroke-width="16"/>
      <g clip-path="url(#xclip)" stroke="#42d392" stroke-width="30">
        <line x1="128" y1="185" x2="232" y2="328"/>
        <line x1="232" y1="185" x2="128" y2="328"/>
      </g>
      <rect x="282" y="318" width="103" height="40" fill="#42d392"/>
    </symbol>
  </defs>

  <rect width="1280" height="640" fill="#101417"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.55"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Left column: brand -->
  <use href="#logo" x="88" y="96" width="128" height="128"/>
  <text x="96" y="338" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="800" font-size="104" fill="#f4f7f8" letter-spacing="-2">Kazo <tspan fill="#42d392">OS</tspan></text>
  <text font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" fill="#a8bac4">
    <tspan x="98" y="398">A simulated operating system</tspan>
    <tspan x="98" y="438">that runs in your browser.</tspan>
  </text>

  <g font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#c9d1d9">
    <rect x="96" y="474" width="56" height="38" rx="19" fill="#151c20" stroke="#34444c"/>
    <text x="124" y="500" text-anchor="middle">C#</text>
    <rect x="164" y="474" width="222" height="38" rx="19" fill="#151c20" stroke="#34444c"/>
    <text x="275" y="500" text-anchor="middle">Blazor WebAssembly</text>
    <rect x="398" y="474" width="96" height="38" rx="19" fill="#151c20" stroke="#34444c"/>
    <text x="446" y="500" text-anchor="middle">.NET 10</text>
    <rect x="506" y="474" width="122" height="38" rx="19" fill="#151c20" stroke="#34444c"/>
    <text x="567" y="500" text-anchor="middle">NuGet SDK</text>
  </g>
  <text x="98" y="556" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="22" fill="#42d392">os.kazo.ca</text>

  <!-- Right column: terminal -->
  <g transform="translate(706 120)">
    <rect width="478" height="400" rx="14" fill="#0b0f12" stroke="#30363d" stroke-width="2"/>
    <path d="M14 0h450a14 14 0 0 1 14 14v30H0V14A14 14 0 0 1 14 0z" fill="#21262d"/>
    <circle cx="24" cy="22" r="7" fill="#ff8f87"/>
    <circle cx="48" cy="22" r="7" fill="#e3b341"/>
    <circle cx="72" cy="22" r="7" fill="#42d392"/>
    <text x="239" y="28" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#8b949e">Terminal — ~</text>

    <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="19" fill="#c9d1d9">
      <text x="22" y="86"><tspan fill="#42d392">user@KazoOs</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan> uname -sr</text>
      <text x="22" y="114">KazoOS 2.2.2</text>
      <text x="22" y="152"><tspan fill="#42d392">user@KazoOs</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan> ls /</text>
      <text x="22" y="180"><tspan fill="#58a6ff">bin&#160;&#160;dev&#160;&#160;etc&#160;&#160;home&#160;&#160;proc&#160;&#160;usr&#160;&#160;var</tspan></text>
      <text x="22" y="218"><tspan fill="#42d392">user@KazoOs</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan> ps</text>
      <text x="22" y="246" fill="#8b949e">&#160;&#160;PID&#160;&#160;CMD</text>
      <text x="22" y="274">&#160;&#160;&#160;&#160;1&#160;&#160;init</text>
      <text x="22" y="302">&#160;&#160;&#160;42&#160;&#160;desktop</text>
      <text x="22" y="330">&#160;&#160;108&#160;&#160;hsh</text>
      <text x="22" y="368"><tspan fill="#42d392">user@KazoOs</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8b949e">$</tspan></text>
      <rect x="201" y="352" width="11" height="21" fill="#42d392"/>
    </g>
  </g>
</svg>
